function nav(active=''){const links=[['#home','首页'],...TRIP.days.map(d=>[`#day${d.id}`,`Day ${d.id}`]),['#food','美食']];return `<header class="nav"><div class="wrap nav-inner"><a class="logo" href="index.html">大连 · 5日</a><nav class="links">${links.map(([u,t])=>`<a class="${active===t?'active':''}" href="${u}">${t}</a>`).join('')}</nav></div></header>`}
function footer(){return `<footer class="footer"><div class="wrap">天气、票价与营业时间以出发前一日官方信息为准。更新：2026-09-28</div></footer>`}
function ticketText(type){return type==='required'?'需提前购票':type==='check'?'当天确认':'无需购票'}
function renderHome(){document.body.innerHTML=nav('首页')+`<main><section class="hero"><div class="wrap"><div class="eyebrow">2026.10.01 — 10.05</div><h1>大连 5 日旅行</h1><p>3 人 · 高强度路线 · 住星海凯泰铭座</p><div class="trip-meta"><div><b>10月1日 07:34</b><span>G4413 抵达大连北</span></div><div><b>10月5日 19:39</b><span>大连北返程</span></div><div><b>天气重点</b><span>2日适合徒步，3日预计有雨</span></div></div></div></section><section class="section"><div class="wrap"><div class="section-head"><h2>行程</h2><p>点击进入当日页面</p></div><div class="day-list">${TRIP.days.map(d=>`<a class="day-row" href="#day${d.id}"><div class="day-no">Day ${d.id}</div><div class="day-main"><h3>${d.title}</h3><p>${d.route}</p></div><div class="day-weather"><b>${d.weather}</b><span>${d.wind}</span></div><div class="arrow">查看 →</div></a>`).join('')}</div><div class="notice"><b>购票：</b>老虎滩、森林动物园、莲花山、水月松间建议提前购买。星海游乐项目现场购票。圣象天门暂未开放。</div></div></section></main>`+footer()}
function renderDay(id){const d=TRIP.days.find(x=>x.id===id);const pending=d.spots.filter(s=>s.ticket==='required').length;document.body.innerHTML=nav(`Day ${id}`)+`<main><section class="page-head"><div class="wrap"><div class="eyebrow">Day ${id} · ${d.date}</div><h1>${d.title}</h1><p>${d.route}</p></div></section><section class="wrap summary"><div><span>天气</span><b class="weather">${d.weather}</b></div><div><span>风力</span><b>${d.wind}</b></div><div><span>降雨</span><b>${d.rain}</b></div><div><span>购票</span><b class="${pending?'ticket-alert':''}">${pending?pending+' 项需提前购票':'无提前购票项'}</b></div></section><section class="wrap timeline">${d.spots.map((s,i)=>`<article class="spot-card"><div class="spot-index">${String(i+1).padStart(2,'0')}</div><div class="spot-main"><h2>${s.name}</h2><p>${s.brief}</p><div class="spot-tags"><span class="duration">建议耗时：${s.stay}</span><span class="ticket ${s.ticket}">${ticketText(s.ticket)}</span></div></div><div class="spot-side"><div>${s.transport}</div><a class="detail-link" href="#attraction/${s.id}/${id}">查看详情 →</a></div></article>`).join('')}</section><div class="wrap day-pager">${id>1?`<a href="#day${id-1}">← Day ${id-1}</a>`:'<span></span>'}${id<5?`<a href="#day${id+1}">Day ${id+1} →</a>`:'<a href="#food">美食 →</a>'}</div></main>`+footer()}
function renderAttraction(idParam,dayParam){const p=new URLSearchParams(location.search),id=idParam||p.get('id'),day=dayParam||p.get('day')||'1',s=TRIP.spots[id];if(!s){location.href='index.html';return}document.body.innerHTML=nav(`Day ${day}`)+`<main class="wrap detail-grid"><article class="detail-main"><div class="eyebrow">Day ${day} · 景点详情</div><h1>${s.name}</h1><p class="lead">${s.intro}</p><div class="fact-list"><div class="fact"><span>开放时间</span><b>${s.hours}</b></div><div class="fact"><span>建议时长</span><b>${s.duration}</b></div><div class="fact"><span>地址</span><b>${s.address}</b></div><div class="fact"><span>费用</span><b>${s.price}</b></div><div class="fact"><span>天气</span><b class="weather">${s.weather}</b></div></div><section class="tips"><h2>注意事项</h2><ul>${s.tips.map(x=>`<li>${x}</li>`).join('')}</ul></section><a class="back" href="#day${day}">← 返回 Day ${day}</a></article><aside class="detail-side"><h3>票务</h3><div class="status-line"><span>状态</span><b class="${s.ticketType==='required'?'ticket-alert':''}">${s.ticket}</b></div><div class="status-line"><span>建议</span><b>${s.ticketType==='required'?'出发前完成购买':'当天再次确认'}</b></div><a class="map-btn" target="_blank" href="https://uri.amap.com/search?keyword=${encodeURIComponent(s.mapName||s.name)}&city=${encodeURIComponent('大连')}">打开高德地图</a></aside></main>`+footer()}
function renderFood(){let type='全部';const types=['全部',...new Set(TRIP.foods.map(x=>x.type))];document.body.innerHTML=nav('美食')+`<main><section class="page-head"><div class="wrap"><div class="eyebrow">Food</div><h1>美食</h1><p>按当天区域选择。国庆热门餐厅建议预约。</p></div></section><section class="section"><div class="wrap"><div class="food-tabs">${types.map((x,i)=>`<button class="food-tab ${i===0?'active':''}" data-type="${x}">${x}</button>`).join('')}</div><div class="food-grid" id="foods"></div></div></section></main>`+footer();const grid=document.querySelector('#foods');function draw(){grid.innerHTML=TRIP.foods.filter(x=>type==='全部'||x.type===type).map(x=>`<article class="food-card"><div class="food-card-top"><h2>${x.name}</h2><span class="price">${x.price}</span></div><p>${x.area} · 推荐：${x.dish}</p><div class="food-meta"><span class="tag">${x.day}</span><span class="tag">${x.book}</span></div></article>`).join('')}draw();document.querySelector('.food-tabs').onclick=e=>{if(!e.target.dataset.type)return;type=e.target.dataset.type;document.querySelectorAll('.food-tab').forEach(b=>b.classList.toggle('active',b.dataset.type===type));draw()}}


function standaloneRoute(){
  const parts=(location.hash||'#home').slice(1).split('/');
  if(parts[0]==='food') renderFood();
  else if(parts[0]==='attraction') renderAttraction(parts[1],parts[2]||'1');
  else if(/^day[1-5]$/.test(parts[0])) renderDay(Number(parts[0].slice(3)));
  else renderHome();
  scrollTo(0,0);
}
addEventListener('hashchange',standaloneRoute);
standaloneRoute();</script></body></html>
